name: Aggregate occupancy
on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: recorder
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet numpy
      - name: Aggregate
        run: python aggregate.py
      - name: Commit
        run: |
          git config user.name  "occupancy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agg state
          git commit -m "aggregate $(date -u +'%F')" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 7))
          done
          echo "push failed after retries"; exit 1
